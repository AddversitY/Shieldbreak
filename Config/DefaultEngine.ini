[/Script/EngineSettings.GameMapsSettings]
; No .umap files ship with the project: the engine's empty Entry map is used and
; AShieldbreakGameMode builds the arena at runtime.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/Shieldbreak.ShieldbreakGameMode
GameInstanceClass=/Script/Shieldbreak.ShieldbreakGameInstance

[/Script/Engine.CollisionProfile]
; ECC_Weapon (see Shieldbreak.h): hitscan trace channel, blocked by default.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Weapon")
; Trigger/overlap-style presets would otherwise inherit the default Block and eat bullets.
+EditProfiles=(Name="Trigger",CustomResponses=((Channel="Weapon",Response=ECR_Ignore)))
+EditProfiles=(Name="OverlapAll",CustomResponses=((Channel="Weapon",Response=ECR_Ignore)))
+EditProfiles=(Name="OverlapAllDynamic",CustomResponses=((Channel="Weapon",Response=ECR_Ignore)))
+EditProfiles=(Name="OverlapOnlyPawn",CustomResponses=((Channel="Weapon",Response=ECR_Ignore)))
+EditProfiles=(Name="Spectator",CustomResponses=((Channel="Weapon",Response=ECR_Ignore)))
+EditProfiles=(Name="UI",CustomResponses=((Channel="Weapon",Response=ECR_Ignore)))

[/Script/Engine.RendererSettings]
; Everything is lit dynamically (the arena spawns its own sun/sky at runtime).
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/OnlineSubsystemUtils.IpNetDriver]
; Shooter-friendly server tick and bandwidth for listen-server playtests.
NetServerMaxTickRate=60
MaxClientRate=100000
MaxInternetClientRate=100000

[/Script/Engine.Player]
ConfiguredInternetSpeed=100000
ConfiguredLanSpeed=100000

[/Script/UnrealEd.ProjectPackagingSettings]
; Greybox meshes and the tint material are engine content referenced only from C++.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
; Imported art is loaded by path at runtime (no hard references), so packaged builds must cook it explicitly.
; Only the Lyra folders the code loads from: the rest of Lyra's content needs Lyra's C++ (gameplay abilities,
; equipment, context effects) and fails to compile in the cook. A few of those Blueprints still come along by
; reference (Lyra anim layers, melee montages, anim modifiers); Tools/Package.bat lets the cook continue past them
; and lists them in Saved/Logs/PackageErrors.txt.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Heroes/Mannequin/Meshes")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Heroes/Mannequin/Animations/Actions")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Heroes/Mannequin/Animations/Locomotion/Rifle")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Heroes/Mannequin/Animations/Locomotion/Pistol")
+DirectoriesToAlwaysCook=(Path="/Game/Weapons/Rifle/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/Weapons/Pistol/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/Weapons/Shotgun/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/Weapons/Grenade/Mesh")
+DirectoriesToAlwaysCook=(Path="/Game/Effects/Particles/Weapons")
+DirectoriesToAlwaysCook=(Path="/Game/Effects/Particles/Impacts")
+DirectoriesToAlwaysCook=(Path="/Game/Effects/Particles/Explosion")
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Sounds/Weapons")
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Sounds/Explosions")
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Sounds/UI")
; Shieldbreak's own art (weapons, armor, world materials and textures), also loaded by path.
+DirectoriesToAlwaysCook=(Path="/Game/Shieldbreak")
; Content/Splash/Emblem.png is read from disk by absolute path (main menu emblem), so ship it as a loose file.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Splash")

